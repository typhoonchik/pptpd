---
name: pptpd

services:
  pptpd:
    image: typhoonchik/pptpd
    container_name: pptpd
    hostname: pptpd
    network_mode: host
    privileged: true
    volumes:
      - /etc/pptpd/pptpd.conf:/etc/pptpd.conf
      - /etc/pptpd/options:/etc/ppp/options
      - /etc/pptpd/options.pptp:/etc/ppp/options.pptp
      - /etc/pptpd/chap-secrets:/etc/ppp/chap-secrets

